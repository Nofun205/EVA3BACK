{% extends "base.html" %}

{% block title %}Iniciar Sesión | BuildCorp Control{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <!-- Encabezado con degradado industrial oscuro y acento ámbar -->
            <div class="card-header text-white text-center py-4 border-0" style="background: linear-gradient(135deg, #090d16 0%, #1e293b 100%); border-bottom: 3px solid #f59e0b !important;">
                <div class="mb-2">
                    <span style="font-size: 3rem; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));">🏗️</span>
                </div>
                <h3 class="fw-bold mb-0 text-white tracking-wide">BUILDCORP</h3>
                <span class="badge bg-warning text-dark text-uppercase mt-1 px-3 py-1 font-monospace" style="font-size: 0.72rem; letter-spacing: 1px;">
                    Control & Maquinaria
                </span>
            </div>

            <!-- Cuerpo del Formulario -->
            <div class="card-body p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <h5 class="fw-bold text-dark mb-1">Acceso a la Plataforma</h5>
                    <p class="text-muted small">Ingrese sus credenciales corporativas para continuar</p>
                </div>

                <form method="post" id="loginForm">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small text-uppercase">
                            <i class="fa-solid fa-user me-1 text-warning"></i> Nombre de Usuario
                        </label>
                        <input type="text" name="username" id="id_username" class="form-control form-control-lg rounded-3 fs-6" required autofocus placeholder="Usuario asignado">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small text-uppercase">
                            <i class="fa-solid fa-lock me-1 text-warning"></i> Contraseña
                        </label>
                        <input type="password" name="password" id="id_password" class="form-control form-control-lg rounded-3 fs-6" required placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold rounded-pill shadow-sm py-2">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Iniciar Sesión
                    </button>
                </form>

                <!-- Botones de Acceso Rápido para Demostración y Defensa -->
                <div class="mt-4 pt-3 border-top text-center">
                    <span class="text-muted small d-block mb-2 fw-semibold">Acceso Rápido para Evaluación:</span>
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="button" class="btn btn-sm btn-outline-dark rounded-pill px-3" onclick="autofill('admin', 'Admin123!')">
                            <i class="fa-solid fa-user-shield me-1 text-warning"></i> Admin
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="autofill('bodeguero', 'Bodega123!')">
                            <i class="fa-solid fa-dolly me-1 text-primary"></i> Bodeguero
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function autofill(u, p) {
    document.getElementById('id_username').value = u;
    document.getElementById('id_password').value = p;
    document.getElementById('loginForm').submit();
}
</script>
{% endblock %}
