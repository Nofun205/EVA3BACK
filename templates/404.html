{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página No Encontrada | BuildCorp</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Animate.css -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #090d16 0%, #0f172a 50%, #1e293b 100%);
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .card-error {
            background: rgba(30, 41, 59, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(14px);
            border-radius: 24px;
            padding: 45px 35px;
            max-width: 580px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .code-pill {
            font-size: 5.5rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .construction-icon {
            font-size: 3.5rem;
            color: #f59e0b;
            filter: drop-shadow(0 4px 12px rgba(245, 158, 11, 0.4));
            margin-bottom: 15px;
        }
        .btn-home {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #0f172a;
            font-weight: 700;
            border: none;
            border-radius: 30px;
            padding: 12px 28px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-home:hover {
            color: #0f172a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.55);
        }
        .btn-admin {
            background: rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 12px 24px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-admin:hover {
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
            border-color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="card-error animate__animated animate__fadeIn">
        <div class="construction-icon">
            <i class="fa-solid fa-person-digging"></i>
        </div>
        <div class="code-pill">404</div>
        <h3 class="fw-bold mb-2 text-white">¡Ruta Fuera de Faena!</h3>
        <p class="text-light text-opacity-75 mb-4" style="font-size: 0.95rem;">
            La página o recurso al que intentas acceder no existe en el sistema o fue trasladado a otra bodega.
        </p>

        <div class="d-flex justify-content-center gap-3 flex-wrap">
            <a href="/" class="btn-home">
                <i class="fa-solid fa-house"></i> Volver a la Plataforma
            </a>
            <a href="/admin/" class="btn-admin">
                <i class="fa-solid fa-shield-halved text-warning"></i> Django Admin
            </a>
        </div>

        <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-light text-opacity-50 small" style="font-size: 0.78rem;">
            BuildCorp SpA &copy; 2026 • Sistema de Alquiler y Control de Maquinaria
        </div>
    </div>

</body>
</html>
